name: CI

on:
  push:
    branches: [feature/aws-cicd-devsecops, main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    name: Python, PostgreSQL and browser tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        # GitHub invokes explicit bash with -e and -o pipefail: tee cannot hide failures.
        shell: bash
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      COMPOSE_PROJECT_NAME: asaanpay-ci-${{ github.run_id }}-${{ github.run_attempt }}
      POSTGRES_USER: asaanpay_ci
      POSTGRES_DB: asaanpay_ci
      API_PORT: "18000"

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Python 3.13
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Prepare disposable test environment
        id: test-environment
        run: |
          mkdir -p "$RUNNER_TEMP/asaanpay-ci-logs"
          python - <<'PY'
          import os
          import secrets

          password = secrets.token_hex(32)
          print(f"::add-mask::{password}")
          with open(os.environ["GITHUB_ENV"], "a") as environment:
              environment.write(f"POSTGRES_PASSWORD={password}\n")
          PY

      - name: Install Python test dependencies
        run: |
          python -m pip install -r requirements.txt 2>&1 | tee "$RUNNER_TEMP/asaanpay-ci-logs/dependencies.log"

      - name: Run Python unit and component tests
        run: |
          RUN_DB_TESTS=0 python -m unittest discover -s tests -v 2>&1 | tee "$RUNNER_TEMP/asaanpay-ci-logs/unit.log"

      - name: Locate Chrome or Chromium
        run: |
          if ! chrome_bin="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"; then
            echo "::error::Chrome/Chromium is required on the Ubuntu runner."
            exit 1
          fi
          "$chrome_bin" --version
          printf 'CHROME_BIN=%s\n' "$chrome_bin" >> "$GITHUB_ENV"
          docker compose version

      - name: Start isolated PostgreSQL and API
        id: test-stack
        run: |
          # A unique project owns its own network, containers and postgres_data volume.
          # Explicit configuration and /dev/null prevent loading a development .env.
          if docker volume inspect "${COMPOSE_PROJECT_NAME}_postgres_data" >/dev/null 2>&1; then
            echo "::error::The disposable database volume already exists; refusing to reuse it."
            exit 1
          fi
          docker compose --env-file /dev/null -f compose.yaml config --quiet
          echo "cleanup-needed=true" >> "$GITHUB_OUTPUT"
          docker compose --env-file /dev/null -f compose.yaml up --build --detach --wait --wait-timeout 120 2>&1 | tee "$RUNNER_TEMP/asaanpay-ci-logs/startup.log"

      - name: Verify health and initialized empty schema
        run: |
          curl --fail --silent --show-error --max-time 10 "http://127.0.0.1:${API_PORT}/api/health" | tee "$RUNNER_TEMP/asaanpay-ci-logs/health.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          health = json.loads((Path(os.environ["RUNNER_TEMP"]) / "asaanpay-ci-logs/health.json").read_text())
          if health != {"status": "ok", "database": "connected"}:
              raise SystemExit("Unexpected API/database health response")
          PY
          rows="$(docker compose --env-file /dev/null -f compose.yaml exec -T db sh -ec 'psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc "SELECT count(*) FROM payment_attempts;"')"
          if [ "$rows" != "0" ]; then
            echo "::error::Expected an initialized, empty disposable payment_attempts table."
            exit 1
          fi

      - name: Run full Python suite with PostgreSQL integration
        run: |
          docker compose --env-file /dev/null -f compose.yaml exec -T -e RUN_DB_TESTS=1 api python -m unittest discover -s tests -v 2>&1 | tee "$RUNNER_TEMP/asaanpay-ci-logs/integration.log"

      - name: Require execution of every database test without skips
        run: |
          python - <<'PY'
          import ast
          import os
          import re
          from pathlib import Path

          expected = set()
          for module, class_name in (
              ("test_checkouts", "CheckoutDatabaseTests"),
              ("test_database", "DatabaseTests"),
          ):
              tree = ast.parse(Path(f"tests/{module}.py").read_text())
              for node in tree.body:
                  if isinstance(node, ast.ClassDef) and node.name == class_name:
                      for method in node.body:
                          if isinstance(method, (ast.FunctionDef, ast.AsyncFunctionDef)) and method.name.startswith("test_"):
                              expected.add(f"{module}.{class_name}.{method.name}")
          log = (Path(os.environ["RUNNER_TEMP"]) / "asaanpay-ci-logs/integration.log").read_text()
          observed = set(re.findall(r"^test_\S+ \(([^)]+)\) \.\.\.", log, re.MULTILINE))
          missing = expected - observed
          if len(expected) < 11 or missing:
              raise SystemExit(f"Database test coverage is incomplete: discovered={len(expected)}, missing={sorted(missing)}")
          if re.search(r"\bskipped\b", log) or not re.search(r"^OK$", log, re.MULTILINE):
              raise SystemExit("The integration suite must pass with zero skipped tests")
          print(f"Verified all {len(expected)} database tests executed; the full suite passed without skips.")
          PY

      - name: Run JavaScript and browser checks
        run: |
          python tests/run_frontend.py --url "http://127.0.0.1:${API_PORT}" --chrome "$CHROME_BIN" 2>&1 | tee "$RUNNER_TEMP/asaanpay-ci-logs/frontend.log"

      - name: Collect container diagnostics
        if: ${{ always() && steps.test-stack.outputs.cleanup-needed == 'true' }}
        run: |
          docker compose --env-file /dev/null -f compose.yaml ps --all > "$RUNNER_TEMP/asaanpay-ci-logs/containers.log" 2>&1 || true
          docker compose --env-file /dev/null -f compose.yaml logs --no-color --timestamps > "$RUNNER_TEMP/asaanpay-ci-logs/compose.log" 2>&1 || true

      - name: Remove disposable containers and database volume
        if: ${{ always() && steps.test-stack.outputs.cleanup-needed == 'true' }}
        run: |
          docker compose --env-file /dev/null -f compose.yaml down --volumes --remove-orphans --timeout 10 2>&1 | tee "$RUNNER_TEMP/asaanpay-ci-logs/cleanup.log"

      - name: Redact temporary password from saved logs
        id: redact-logs
        if: ${{ always() && steps.test-environment.outcome == 'success' }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          password = os.environ["POSTGRES_PASSWORD"]
          for path in (Path(os.environ["RUNNER_TEMP"]) / "asaanpay-ci-logs").iterdir():
              if path.is_file():
                  path.write_text(path.read_text(errors="replace").replace(password, "***"))
          PY

      - name: Upload test logs
        if: ${{ always() && steps.redact-logs.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/asaanpay-ci-logs/
          retention-days: 7
          if-no-files-found: warn

  bandit:
    name: Bandit SAST
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Python 3.13
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Install isolated Bandit 1.9.4
        run: |
          python -m venv "$RUNNER_TEMP/bandit"
          "$RUNNER_TEMP/bandit/bin/python" -m pip install bandit==1.9.4
          "$RUNNER_TEMP/bandit/bin/bandit" --version

      - name: Require a complete SAST scan with no blocking findings
        run: |
          "$RUNNER_TEMP/bandit/bin/python" .github/scripts/bandit_gate.py

  gitleaks:
    name: Gitleaks history scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_LINUX_X64_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - name: Check out complete branch and tag history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install checksum-verified Gitleaks 8.30.1 CLI
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --silent --show-error --location --retry 3 --connect-timeout 10 --max-time 120 \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' "$GITLEAKS_LINUX_X64_SHA256" "$archive" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/gitleaks"
          tar -xzf "$archive" -C "$RUNNER_TEMP/gitleaks" gitleaks
          "$RUNNER_TEMP/gitleaks/gitleaks" version

      - name: Scan all fetched history with redaction
        run: |
          # GL-001 lists only reviewed historical fingerprints; no secret report is uploaded.
          bash .github/scripts/gitleaks_gate.sh "$RUNNER_TEMP/gitleaks/gitleaks"

  pip-audit:
    name: Python dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Python 3.13
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Install isolated pip-audit 2.10.1
        run: |
          python -m venv "$RUNNER_TEMP/pip-audit"
          "$RUNNER_TEMP/pip-audit/bin/python" -m pip install pip-audit==2.10.1
          "$RUNNER_TEMP/pip-audit/bin/pip-audit" --version

      - name: Audit requirements and resolved transitive dependencies
        run: |
          # --strict rejects dependency-collection failures; it is not a severity filter.
          # JSON records the resolved inventory and advisory IDs without advisory descriptions.
          "$RUNNER_TEMP/pip-audit/bin/pip-audit" -r requirements.txt --strict \
            --progress-spinner off --timeout 30 --format json --desc off --aliases on

  build-release:
    name: Versioned image, Trivy and release artifact
    needs: [tests, bandit, gitleaks, pip-audit]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Python 3.13
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Test scanner and database failure handling
        run: python -m unittest discover -s .github/scripts -p 'test_*.py' -v

      - name: Build the linux/amd64 release image once
        env:
          BUILD_COMMIT: ${{ github.sha }}
          BUILD_RUN_ID: ${{ github.run_id }}
          BUILD_ATTEMPT: ${{ github.run_attempt }}
        run: |
          export RELEASE_WORK="$RUNNER_TEMP/asaanpay-release"
          echo "RELEASE_WORK=$RELEASE_WORK" >> "$GITHUB_ENV"
          mkdir -p "$RELEASE_WORK"
          python scripts/release.py build --commit "$BUILD_COMMIT" \
            --run-id "$BUILD_RUN_ID" --attempt "$BUILD_ATTEMPT" --state "$RELEASE_WORK/state.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          state = json.loads((Path(os.environ["RELEASE_WORK"]) / "state.json").read_text())
          with open(os.environ["GITHUB_ENV"], "a") as output:
              output.write(f"RELEASE_ID={state['metadata']['release_id']}\nIMAGE_ID={state['image_id']}\n")
          PY

      - name: Install checksum-verified Trivy 0.69.3
        run: bash .github/scripts/install_trivy.sh "$RELEASE_WORK/bin"

      - name: Scan exact image and enforce vulnerability policy
        run: bash .github/scripts/trivy_gate.sh "$RELEASE_WORK/bin/trivy" "$IMAGE_ID" "$RELEASE_WORK/security"

      - name: Smoke-test exact release image against disposable PostgreSQL
        run: python scripts/release.py smoke --state "$RELEASE_WORK/state.json"

      - name: Save the approved image and checksum its release package
        run: |
          python scripts/release.py package --state "$RELEASE_WORK/state.json" \
            --scan-receipt "$RELEASE_WORK/security/approved.json" --output "$RELEASE_WORK/packages"

      - name: Reload and verify release package without rebuilding
        run: |
          python scripts/release.py verify "$RELEASE_WORK/packages/asaanpay-release-$RELEASE_ID"

      - name: Upload verified release package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: asaanpay-release-${{ env.RELEASE_ID }}
          path: ${{ env.RELEASE_WORK }}/packages/asaanpay-release-${{ env.RELEASE_ID }}/
          retention-days: 14
          compression-level: 0
          if-no-files-found: error

      - name: Publish readable security summary
        if: ${{ always() }}
        run: |
          if [ -f "$RELEASE_WORK/security/summary.md" ]; then
            cat "$RELEASE_WORK/security/summary.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Trivy did not complete policy evaluation. Inspect the failed build/install/scan step; no release is approved.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload image security evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: image-security-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.RELEASE_WORK }}/security/
          retention-days: 14
          if-no-files-found: warn
